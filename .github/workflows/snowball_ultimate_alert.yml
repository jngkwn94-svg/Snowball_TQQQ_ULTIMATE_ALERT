name: snowball-tqqq-alert

on:
  # [권장] 외부 무료 크론(cron-job.org)에서 한국시간 화~토 06:10(또는 05:10 EDT)에
  # GitHub workflow_dispatch API를 호출하면 GitHub schedule 지연 없이 즉시 실행됩니다.
  workflow_dispatch:
    inputs:
      force_send:
        description: "1이면 마감/중복 확인 없이 가장 최근 봉으로 지금 바로 발송"
        default: "0"

  # [백업용 schedule] 외부 크론을 안 쓸 경우를 대비한 최소 백업 (중복 줄 세우기 최소화)
  schedule:
    - cron: "11 20 * * 1-5" # EDT 16:11 (한국 05:11)
    - cron: "11 21 * * 1-5" # EST 16:11 (한국 06:11)
    - cron: "11 17,18 * 7,11,12 1-5" # 조기 마감일 백업

permissions:
  contents: write

concurrency:
  group: snowball-alert
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 신호 계산 및 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: always
          RSI_MODE: 축소형
          MANUAL_STAGE: "1"      # 현재 계좌 Stage (DIP1 보유 중)
          MANUAL_SHARES: "304"   # 현재 실제 보유 주수 (추가 매수 시 수정 또는 삭제)
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python snowball_bot.py

      - name: 발송 기록 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q && git push && break
              echo "push 재시도 $i"; sleep 5
            done
          fi
